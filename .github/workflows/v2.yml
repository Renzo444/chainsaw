---
name: v2

on:
  push:
    tags: [v2*]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Build
        run: cargo build --all --release --target x86_64-unknown-linux-gnu && strip
          target/x86_64-unknown-linux-gnu/release/rockwheel
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-binary
          path: target/x86_64-unknown-linux-gnu/release/rockwheel
          if-no-files-found: error
          retention-days: 1
      - name: Move files to artifacts
        run: mv target/x86_64-unknown-linux-gnu/release/rockwheel mappings LICENCE
          README.md rockwheel/
      - name: Create ZIP File
        run: tar -czf rockwheel_x86_64-unknown-linux-gnu.tar.gz rockwheel/*
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rockwheel_x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Target
        run: sudo apt install gcc-aarch64-linux-gnu
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Build
        run: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc
          cargo build --all --release --target aarch64-unknown-linux-gnu && aarch64-linux-gnu-strip
          target/aarch64-unknown-linux-gnu/release/rockwheel
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-binary-arm
          path: target/aarch64-unknown-linux-gnu/release/rockwheel
          if-no-files-found: error
          retention-days: 1
      - name: Move files to artifacts
        run: mv target/aarch64-unknown-linux-gnu/release/rockwheel mappings LICENCE
          README.md rockwheel/
      - name: Create ZIP File
        run: tar -czf rockwheel_aarch64-unknown-linux-gnu.tar.gz rockwheel/*
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rockwheel_aarch64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --all --release
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: win-binary
          path: target/release/rockwheel.exe
          if-no-files-found: error
          retention-days: 1
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Move files to artifacts
        run: move target/release/rockwheel.exe rockwheel/ ; move mappings rockwheel/;
          move LICENCE rockwheel/; move README.md rockwheel/
      - name: Create ZIP File
        shell: pwsh
        run: Compress-Archive -Path .\rockwheel\ -Destination rockwheel_x86_64-pc-windows-msvc.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rockwheel_x86_64-pc-windows-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-mac:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Build for mac
        run: cargo build --all --release && strip target/release/rockwheel
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: mac-binary
          path: target/release/rockwheel
          if-no-files-found: error
          retention-days: 1
      - name: Move files to artifacts
        run: mv target/release/rockwheel mappings LICENCE README.md rockwheel/
      - name: Create ZIP File
        run: zip -qq -r rockwheel_x86_64-apple-darwin.zip rockwheel
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rockwheel_x86_64-apple-darwin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-mac-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install latest rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Build for mac
        run: cargo build --all --release && strip target/release/rockwheel
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: mac-binary-arm
          path: target/release/rockwheel
          if-no-files-found: error
          retention-days: 1
      - name: Move files to artifacts
        run: mv target/release/rockwheel mappings LICENCE README.md rockwheel/
      - name: Create ZIP File
        run: zip -qq -r rockwheel_aarch64-apple-darwin.zip rockwheel
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rockwheel_aarch64-apple-darwin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-complete:
    needs:
      - build-linux
      - build-linux-arm
      - build-win
      - build-mac
      - build-mac-arm
    runs-on: ubuntu-latest
    steps:
      - name: Create artifacts directory
        run: mkdir rockwheel
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ./rockwheel-root
      - name: Checkout Sigma Repo
        uses: actions/checkout@v6
        with:
          repository: SigmaHQ/sigma
          path: ./sigma
      - name: Checkout EVTX Samples Repo
        uses: actions/checkout@v6
        with:
          repository: sbousseaden/EVTX-ATTACK-SAMPLES
          path: ./EVTX-ATTACK-SAMPLES
      - name: Move files to artifacts
        run: mv sigma EVTX-ATTACK-SAMPLES rockwheel/
      - name: Download build-linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: ./rockwheel-linux
      - name: Download build-linux-arm binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary-arm
          path: ./rockwheel-linux-arm
      - name: Download build-win binary
        uses: actions/download-artifact@v4
        with:
          name: win-binary
          path: ./rockwheel-win
      - name: Download build-mac binary
        uses: actions/download-artifact@v4
        with:
          name: mac-binary
          path: ./rockwheel-mac
      - name: Download build-mac-arm binary
        uses: actions/download-artifact@v4
        with:
          name: mac-binary-arm
          path: ./rockwheel-mac-arm
      - name: build zip file content
        run: mv ./rockwheel-linux/rockwheel ./rockwheel/rockwheel_x86_64-unknown-linux-gnu;
          mv ./rockwheel-linux-arm/rockwheel ./rockwheel/rockwheel_aarch64-unknown-linux-gnu;
          mv ./rockwheel-win/rockwheel.exe ./rockwheel/rockwheel_x86_64-pc-windows-msvc.exe;
          mv ./rockwheel-mac/rockwheel ./rockwheel/rockwheel_x86_64-apple-darwin; mv ./rockwheel-mac-arm/rockwheel
          ./rockwheel/rockwheel_aarch64-apple-darwin; mv ./rockwheel-root/mappings ./rockwheel-root/LICENCE
          ./rockwheel-root/README.md ./rockwheel-root/rules/ ./rockwheel/
      - name: Create ZIP File
        run: zip -r rockwheel_all_platforms+rules+examples.zip rockwheel/
      - name: Remove Samples
        run: rm -rf rockwheel/EVTX-ATTACK-SAMPLES/
      - name: Create ZIP File
        run: zip -r rockwheel_all_platforms+rules.zip rockwheel/
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            rockwheel_all_platforms+rules.zip
            rockwheel_all_platforms+rules+examples.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
